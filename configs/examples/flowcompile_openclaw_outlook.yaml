schema_version: "flowcompile.flat.v1"

# Core
experiment_id: "openclaw_outlook_past24h"
workflow_type: "openclaw_lobster"

# Required by flat schema. Not used for the OpenClaw profile/predict path.
dataset: "MATH500"
validate_file: "data/math500_validate.jsonl"
test_file: "data/math500_test.jsonl"

# Model config used by profile/get-latency.
model_config: "configs/config.qwen35.local.yaml"

# OpenClaw Lobster workflow + prepared profiling data (skip prepare-data stage).
openclaw_lobster_workflow_file: "/home/junyan/.openclaw/workspace/workflows/outlook-past-24h.lobster.yaml"
profile_training_data: "/home/junyan/.openclaw/workspace/.local/outlook/flowcompile_training.json"

# predict must read trace data explicitly when prepare-data is skipped.
predict_trace_data: "/home/junyan/.openclaw/workspace/.local/outlook/flowcompile_training.json"

# Search space (required)
search_axes: ["model", "budget"]
search_models:
  - "qwen35-0.8b-local"
  - "qwen35-2b-local"
  - "qwen35-4b-local"
  - "qwen35-9b-local"
  - "qwen35-27b-local"
search_budgets: [10, 200, 400, 800, 1000, 1500, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 12000, 16000]

# Profile controls
profile_models:
  - "qwen35-0.8b-local"
  - "qwen35-2b-local"
  - "qwen35-4b-local"
  - "qwen35-9b-local"
  - "qwen35-27b-local"
profile_min_samples_per_agent: 1
profile_max_concurrent: 32

# Latency benchmark controls
latency_models:
  - "Qwen/Qwen3.5-0.8B"
  - "Qwen/Qwen3.5-2B"
  - "Qwen/Qwen3.5-4B"
  - "Qwen/Qwen3.5-9B"
  - "Qwen/Qwen3.5-27B"
latency_backend: "openai"
