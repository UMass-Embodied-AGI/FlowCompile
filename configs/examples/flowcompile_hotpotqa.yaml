schema_version: "flowcompile.flat.v1"

# Core
experiment_id: "hotpotqa"
workflow_type: "hotpotqa"
dataset: "HotpotQA"
model_config: "configs/config.yaml"
ground_truth_llm: "gpt-5-mini"
agent_dataset_model: "gpt-5"

# Canonical split files
validate_file: "data/hotpotqa_validate.jsonl"
test_file: "data/hotpotqa_test.jsonl"

# Required shared search space
search_axes: ["model", "budget", "structure"]
search_budgets: [10, 50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 1000, 1500, 2000, 4000, 8000]

# Test overrides
test_parallel: 4
test_max_tasks: 16
test_random_seed: 42
test_pareto_sample_n: 20

# Runtime overrides
runtime_strategy: "preference"
runtime_alpha: 0.5

# KNN overrides
knn_k: 10
knn_evaluate_parallel: 32
knn_evaluate_random_seed: 42
